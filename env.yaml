name: capstone_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyter
  - jupyterlab
  - numpy
  - pandas
  - pillow              # Vision LLM page rendering (notebooks/parser_tools.py)
  - pytest
  - pytest-mock
  - pip:
      # RAG framework
      - langchain>=0.3
      - langchain-community>=0.3
      - langchain-huggingface>=0.1
      - langchain-chroma>=0.1
      - langchain-google-genai>=2.0
      # Vector + sparse stores
      - chromadb>=0.5
      - rank-bm25>=0.2
      # Embeddings (BGE local)
      - sentence-transformers>=3.0
      # PDF parsers
      - pypdf>=5.0
      - pdfplumber>=0.11
      # Tokenization
      - tiktoken>=0.7
      # Env loading
      - python-dotenv>=1.0
      # Dev: synthetic PDF generator for tests/fixtures (T0.6)
      - reportlab>=4.0
